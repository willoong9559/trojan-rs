[package]
name = "trojan-rs"
version = "0.1.12"
edition = "2021"

[dependencies]
tokio = { version = "1.49", features = ["full", "signal"] }
tokio-tungstenite = "0.28"
futures-util = "0.3"
sha2 = "0.10"
anyhow = "1.0"
bytes = "1.11"
hex = "0.4"
clap = { version = "4.5", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
tokio-rustls = "0.26.4"
# REALITY needs the connection-scoped APIs maintained by the cfal/rustls fork.
rustls = "0.23.46"
rustls-pemfile = "2.2.0"
aws-lc-rs = "1.18"
base64 = "0.22"
rcgen = { version = "0.14", features = ["aws_lc_rs"] }
subtle = "2.6"
serde = { version = "1.0", features = ["derive"] }
toml = "0.9"
tonic = "0.14"
tokio-stream = "0.1.18"
tokio-rustls-acme = "0.9.1"
futures = "0.3.31"
h2 = "0.4.13"
http = "1.4.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
pin-project-lite = "0.2"
socket2 = "0.6"

[patch.crates-io]
rustls = { git = "https://github.com/cfal/rustls", rev = "d17d0fc304c03fe6e2c96ade6cd39c33b951c3af" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
incremental = false
panic = "unwind"
strip = true
