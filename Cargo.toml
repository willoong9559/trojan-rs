[package]
name = "trojan-rs"
version = "0.2.0"
edition = "2021"

[dependencies]
tokio = { version = "1.49", features = ["full", "signal"] }
tokio-tungstenite = "0.28"
futures-util = "0.3"
sha2 = "0.10"
anyhow = "1.0"
bytes = "1.11"
hex = "0.4"
clap = { version = "4.5", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
tokio-rustls = "0.26.4"
# Ordinary TLS stays on the upstream crate. REALITY uses the vendored fork
# below under a distinct crate name.
rustls = "0.23.36"
rustls-reality = { package = "rustls", path = "vendor/rustls-reality/rustls" }
rustls-pemfile = "2.2.0"
aws-lc-rs = "1.18"
base64 = "0.22"
rcgen = { version = "0.14", features = ["aws_lc_rs"] }
subtle = "2.6"
serde = { version = "1.0", features = ["derive"] }
toml = "0.9"
tonic = "0.14"
tokio-stream = "0.1.18"
tokio-rustls-acme = "0.9.1"
futures = "0.3.31"
h2 = "0.4.13"
http = "1.4.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
pin-project-lite = "0.2"
socket2 = "0.6"
aes-gcm = "0.10"
aes = "0.8"
chacha20poly1305 = "0.10"
crc32fast = "1.5"
hmac = "0.12"
md-5 = "0.10"
sha3 = "0.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
incremental = false
panic = "unwind"
strip = true
